services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-ops-copilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_ops_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_ops_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
